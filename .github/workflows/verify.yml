name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: codex-mobile-providers-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: providers
      - id: host
        name: Read the pinned host revision
        working-directory: providers
        run: |
          revision=$(sed -n 's/^codexMobile.hostRevision=//p' gradle.properties)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ciurlaro/codex-mobile
          ref: ${{ steps.host.outputs.revision }}
          path: host
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install Android toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes gperf libarchive-tools ninja-build patchelf ripgrep zip
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;29.0.14206865"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - id: telegram-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: providers/android/telegram/src/main/jniLibs/arm64-v8a/libtdjsonjava.so
          key: telegram-jni-${{ runner.os }}-${{ runner.arch }}-ndk29-${{ hashFiles('providers/scripts/prepare-telegram-library.sh', 'providers/scripts/verify-telegram-library.sh', 'providers/android/telegram/build.gradle.kts', 'providers/build-logic/src/main/kotlin/PrepareTelegramLibraryTask.kt', 'providers/build-logic/src/main/kotlin/codexmobile.telegram-library.gradle.kts', 'providers/gradle/libs.versions.toml') }}
      - name: Verify restored Telegram native library
        if: steps.telegram-cache.outputs.cache-hit == 'true'
        run: providers/scripts/verify-telegram-library.sh "$ANDROID_HOME/ndk/29.0.14206865" providers/android/telegram/src/main/jniLibs/arm64-v8a/libtdjsonjava.so
      - name: Verify contracts, schemas, SBOM, and JVM tests
        working-directory: providers
        run: |
          bash scripts/verify-structure.sh
          ./gradlew --no-daemon :codex-mobile-plugins-build-logic:test :test
      - name: Build and lint Android feature providers
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          providers/scripts/build-android-providers.sh host debug
      - name: Create ephemeral release key
        if: github.event_name == 'push'
        run: >-
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/release.jks"
          -storepass android -keypass android -alias ci-release -keyalg RSA
          -keysize 3072 -validity 1 -dname "CN=Codex Mobile Provider CI"
      - name: Build the main release candidate
        if: github.event_name == 'push'
        env:
          CODEX_MOBILE_RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          CODEX_MOBILE_RELEASE_STORE_PASSWORD: android
          CODEX_MOBILE_RELEASE_KEY_ALIAS: ci-release
          CODEX_MOBILE_RELEASE_KEY_PASSWORD: android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          providers/scripts/build-android-providers.sh host release
          printf '%s\n' "$GITHUB_SHA" > providers/source-revision.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provider-android-tests
          retention-days: 14
          if-no-files-found: error
          path: |
            host/modules/android/app/build/outputs/apk/debug/app-debug.apk
            host/modules/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            providers/android/documents/build/outputs/aar/documents-android-debug.aar
            providers/android/telegram/build/outputs/aar/telegram-android-debug.aar
            providers/android/documents/build/outputs/apk/androidTest/debug/documents-android-debug-androidTest.apk
            providers/android/telegram/build/outputs/apk/androidTest/debug/telegram-android-debug-androidTest.apk
            providers/scripts/run-android-device-tests.sh
            providers/docs/sbom.cdx.json
            providers/LICENSE
            providers/LICENSES/MLKIT-EXCEPTION.txt
            providers/THIRD_PARTY_NOTICES.md
      - name: Upload verified provider candidate
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-mobile-provider-candidate
          retention-days: 14
          if-no-files-found: error
          path: |
            host/modules/android/app/build/outputs/apk/release/app-release.apk
            host/modules/android/app/build/outputs/mapping/release/mapping.txt
            providers/android/documents/build/outputs/aar/documents-android-release.aar
            providers/android/telegram/build/outputs/aar/telegram-android-release.aar
            providers/docs/sbom.cdx.json
            providers/LICENSE
            providers/LICENSES/MLKIT-EXCEPTION.txt
            providers/THIRD_PARTY_NOTICES.md
            providers/source-revision.txt

  container-pr:
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: ghcr.io/ciurlaro/codex-mobile-plugins:candidate-${{ github.sha }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}
      - name: Exercise the image
        run: >-
          bash scripts/verify-mcp.sh
          ghcr.io/ciurlaro/codex-mobile-plugins:candidate-${{ github.sha }}-${{ matrix.suffix }}

  container-main:
    if: github.event_name == 'push'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/ciurlaro/codex-mobile-plugins:candidate-${{ github.sha }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}
      - name: Exercise the exact pushed image
        run: >-
          bash scripts/verify-mcp.sh
          ghcr.io/ciurlaro/codex-mobile-plugins@${{ steps.image.outputs.digest }}
      - name: Record verified image provenance
        run: |
          mkdir -p image-provenance
          jq -n \
            --arg source "$GITHUB_SHA" \
            --arg platform "${{ matrix.platform }}" \
            --arg repository "ghcr.io/ciurlaro/codex-mobile-plugins" \
            --arg digest "${{ steps.image.outputs.digest }}" \
            '{source: $source, platform: $platform, repository: $repository, digest: $digest}' \
            > "image-provenance/${{ matrix.suffix }}.json"
      - name: Upload verified image provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-mobile-provider-image-${{ matrix.suffix }}
          retention-days: 14
          if-no-files-found: error
          path: image-provenance/${{ matrix.suffix }}.json

  device:
    needs: android
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: provider-android-tests
          path: device-tests
      - name: Run Documents and Telegram provider tests
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-build: 15261927 # 36.5.11
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash device-tests/providers/scripts/run-android-device-tests.sh device-tests
