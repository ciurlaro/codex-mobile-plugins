name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag for provider integrations
        required: true
        default: providers-0.2.0-preview.3
      image_tag:
        description: GHCR tag matching the plugin implementation version
        required: true
        default: 1.0.0

permissions:
  contents: read
  actions: read

concurrency:
  group: codex-mobile-providers-release
  cancel-in-progress: false

jobs:
  candidate:
    if: github.repository == 'ciurlaro/codex-mobile-plugins' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      run_id: ${{ steps.verify.outputs.run_id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Verify requested versions
        run: |
          test "${{ inputs.image_tag }}" = "$(jq -r '.version' .agents/plugins/plugins/documents/.codex-plugin/plugin.json)"
          test "${{ inputs.image_tag }}" = "$(jq -r '.version' .agents/plugins/plugins/telegram/.codex-plugin/plugin.json)"
      - id: verify
        name: Find the successful verification for this exact revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/verify.yml/runs?head_sha=$GITHUB_SHA&event=push&status=completed&per_page=20" --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id // empty')
          test -n "$run_id" || { echo "No successful Verify run exists for $GITHUB_SHA" >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: codex-mobile-provider-candidate
          path: candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.verify.outputs.run_id }}
      - name: Verify candidate provenance
        run: |
          test "$(cat candidate/providers/source-revision.txt)" = "$GITHUB_SHA"
          test -s candidate/providers/android/documents/build/outputs/aar/documents-android-release.aar
          test -s candidate/providers/android/telegram/build/outputs/aar/telegram-android-release.aar

  image:
    needs: candidate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/ciurlaro/codex-mobile-plugins:${{ inputs.image_tag }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

  publish:
    needs: [candidate, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: codex-mobile-provider-candidate
          path: candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.candidate.outputs.run_id }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: image
        name: Publish the multi-architecture image manifest
        run: |
          image="ghcr.io/ciurlaro/codex-mobile-plugins:${{ inputs.image_tag }}"
          docker buildx imagetools create --tag "$image" "$image-amd64" "$image-arm64"
          echo "digest=sha256:$(docker buildx imagetools inspect --raw "$image" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Finalize immutable release metadata
        run: |
          scripts/write-release-metadata.py "${{ inputs.tag }}" "${{ steps.image.outputs.digest }}"
          bash scripts/verify-structure.sh
      - name: Commit release metadata without racing main
        id: metadata
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .agents/plugins/plugins/documents/.mcp.json .agents/plugins/plugins/telegram/.mcp.json
          git diff --cached --quiet && { echo "Release metadata did not change" >&2; exit 1; }
          git commit -m "Publish ${{ inputs.tag }} metadata [skip ci]"
          git push origin HEAD:main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Write aggregate release manifest
        run: |
          scripts/write-release-manifest.py \
            --provider-revision "$GITHUB_SHA" \
            --documents-aar candidate/providers/android/documents/build/outputs/aar/documents-android-release.aar \
            --telegram-aar candidate/providers/android/telegram/build/outputs/aar/telegram-android-release.aar \
            --mcp-image-digest "${{ steps.image.outputs.digest }}" \
            --output release/release-manifest.json
          sha256sum release/release-manifest.json > release/release-manifest.json.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provider-release
          if-no-files-found: error
          path: |
            candidate/providers/android/documents/build/outputs/aar/documents-android-release.aar
            candidate/providers/android/telegram/build/outputs/aar/telegram-android-release.aar
            release/release-manifest.json
            release/release-manifest.json.sha256
            candidate/providers/docs/sbom.cdx.json
            candidate/providers/LICENSE
            candidate/providers/LICENSES/MLKIT-EXCEPTION.txt
            candidate/providers/THIRD_PARTY_NOTICES.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(release create "${{ inputs.tag }}" --target "${{ steps.metadata.outputs.commit }}" --generate-notes --title "Codex Mobile providers ${{ inputs.image_tag }}")
          if [[ "${{ inputs.tag }}" == *preview* ]]; then args+=(--prerelease); fi
          args+=(candidate/providers/android/documents/build/outputs/aar/documents-android-release.aar candidate/providers/android/telegram/build/outputs/aar/telegram-android-release.aar release/release-manifest.json release/release-manifest.json.sha256 candidate/providers/docs/sbom.cdx.json candidate/providers/LICENSE candidate/providers/LICENSES/MLKIT-EXCEPTION.txt candidate/providers/THIRD_PARTY_NOTICES.md)
          gh "${args[@]}"
