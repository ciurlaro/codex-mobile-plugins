[versions]
agp = "9.2.1"
kotlin = "2.3.10"
provider = "1.0.0"
coroutines = "1.10.2"
serialization = "1.9.0"
json = "20250517"
extension-provider-api = "2.0.0"
mcp = "0.14.0"
pdfbox = "3.0.7"
tess4j = "5.19.0"
pdfium = "2.0.0"
mlkit-text = "16.0.1"
androidx-test-ext = "1.3.0"
androidx-test-runner = "1.7.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
json = { module = "org.json:json", version.ref = "json" }
extension-provider-api = { module = "io.github.ciurlaro.codexmobile:extension-provider-api", version.ref = "extension-provider-api" }
mcp-server = { module = "io.modelcontextprotocol:kotlin-sdk-server", version.ref = "mcp" }
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }
tess4j = { module = "net.sourceforge.tess4j:tess4j", version.ref = "tess4j" }
pdfium = { module = "io.legere:pdfiumandroid-core", version.ref = "pdfium" }
mlkit-text-recognition = { module = "com.google.mlkit:text-recognition", version.ref = "mlkit-text" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }

[bundles]
android-test = ["androidx-test-ext-junit", "androidx-test-runner"]

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
